<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background: the violet to pink of the README banner. -->
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tagFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3ECFF"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
    <!-- The tag is white with the hole and the note cut out, so the background shows through. -->
    <mask id="tagCutout" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="black"/>
      <path d="M512 228 L668 384 V742 a54 54 0 0 1 -54 54 H410 a54 54 0 0 1 -54 -54 V384 Z"
            fill="white" stroke="white" stroke-width="56" stroke-linejoin="round"/>
      <circle cx="512" cy="364" r="40" fill="black"/>
      <!-- Two beamed eighth notes. -->
      <g fill="black">
        <ellipse cx="452" cy="680" rx="52" ry="40" transform="rotate(-22 452 680)"/>
        <ellipse cx="596" cy="644" rx="52" ry="40" transform="rotate(-22 596 644)"/>
        <rect x="478" y="488" width="24" height="196"/>
        <rect x="622" y="452" width="24" height="196"/>
        <path d="M478 488 L646 452 V512 L478 548 Z"/>
      </g>
    </mask>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="22" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="12" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#iconShadow)">
    <g clip-path="url(#squircle)">
      <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
      <rect x="100" y="100" width="824" height="824" fill="url(#shine)"/>
      <!-- Sound wave along the bottom. -->
      <g fill="#FFFFFF" opacity="0.14">
        <rect x="150" y="772" width="26" height="80" rx="13"/>
        <rect x="196" y="742" width="26" height="140" rx="13"/>
        <rect x="242" y="792" width="26" height="40" rx="13"/>
        <rect x="288" y="752" width="26" height="120" rx="13"/>
        <rect x="334" y="782" width="26" height="60" rx="13"/>
        <rect x="690" y="772" width="26" height="80" rx="13"/>
        <rect x="736" y="742" width="26" height="140" rx="13"/>
        <rect x="782" y="782" width="26" height="60" rx="13"/>
        <rect x="828" y="756" width="26" height="112" rx="13"/>
      </g>
      <rect x="100.5" y="100.5" width="823" height="823" rx="186" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
    </g>
  </g>

  <g transform="rotate(-18 512 520)" filter="url(#shadow)">
    <rect width="1024" height="1024" fill="url(#tagFill)" mask="url(#tagCutout)"/>
  </g>
</svg>
