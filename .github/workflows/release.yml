name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The whole history and its tags, for the release notes in the update feed.
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: swift test

      - name: Build app (Apple Silicon and Intel)
        env:
          UNIVERSAL: "1"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}" ./build-app.sh
          lipo -archs build/Tagwell.app/Contents/MacOS/Tagwell

      - name: Build DMG
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/make-dmg.sh

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Tagwell.app dist/Tagwell.zip
          cp build/Tagwell.dmg dist/Tagwell.dmg
          cd dist
          shasum -a 256 Tagwell.dmg Tagwell.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Sign the update and write the Sparkle feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/make-appcast.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          generate_release_notes: true
          files: |
            dist/Tagwell.dmg
            dist/Tagwell.zip
            dist/SHA256SUMS
            dist/appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
